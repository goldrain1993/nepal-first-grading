name: Validate web app
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "functions/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax checks
        run: |
          node --check docs/app.js
          node --check docs/core.mjs
          node --check docs/roster-excel.mjs
          node --check docs/page-grouping.mjs
          node --check docs/flexible-upload.mjs
          node --check functions/index.js
          node --check functions/test-rules.js
          node --check functions/grading-validation.js
          node --check docs/ai-grading-batch.mjs
      - name: AI evidence and selected-student grading tests
        run: |
          node tests/grading-validation.cjs
          node tests/ai-grading-batch.mjs
      - name: Excel roster and PDF assignment tests
        run: node tests/smoke.mjs
      - name: Variable pages and grading rules
        run: node tests/page-grading.mjs
